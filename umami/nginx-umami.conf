# Umami 站点 nginx 配置
# 放置路径：/etc/nginx/conf.d/umami.conf
# 域名：umami.ruinexai.com（先在 Cloudflare 添加 DNS A 记录，验证期灰云）
#
# 首次启用流程：
#   1. 先用"临时 80 端口"配置让 certbot 通过 HTTP-01 验证签发证书（见 UMAMI_DEPLOY.md 第 6 步）
#   2. 证书签发成功后，取消下方 443 段注释并 reload nginx
#
# 占位符：无（域名已按 ruinexai.com 写死）

server {
    listen 80;
    listen [::]:80;
    server_name umami.ruinexai.com;

    # ACME HTTP-01 验证路径（certbot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 请求全部跳转 HTTPS（证书签好后生效）
    location / {
        return 301 https://$host$request_uri;
    }
}

